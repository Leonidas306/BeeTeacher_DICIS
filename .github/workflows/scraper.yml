name: Scrape schedules & Sync BeeTeacher Forms

on:
  schedule:
    - cron: "0 0 * * 0" # cada domingo a medianoche
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapper/requirements.txt

      - name: Run UG Classroom Scraper
        run: |
          cd scrapper
          python src/main.py

      - name: Sync BeeTeacher Google Forms & Sheets
        run: |
          cd scrapper
          python src/sync_forms.py

      - name: Commit and push updated data
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "BeeTeacher Bot"
          git config --global user.email "actions@github.com"
          git add frontend/src/data/
          git commit -m "chore: sync schedules and BeeTeacher tutors data" || echo "No changes to commit"
          git push
